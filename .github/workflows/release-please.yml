name: Release Please

# Release Please only maintains the release PR. It never tags or creates a
# GitHub release (skip-github-release), and merging the release PR starts
# nothing: a person dispatches the Release tags workflow (release.yml) from
# main, and someone else approves it. See docs/RELEASING.md.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-pr:
    name: Update the release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Pushing the release branch, opening the PR, and creating and applying
    # the "autorelease: pending" label.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Queue rather than cancel, so no run stops part-way through updating the
    # release branch. A newer pending run replaces an older pending one.
    concurrency:
      group: release-please-pr
      cancel-in-progress: false
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # A PR opened or updated with GITHUB_TOKEN does not start CI. Close and
      # reopen the release PR to run CI before merging it.
      - name: Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main
          skip-github-release: true
