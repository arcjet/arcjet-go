name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    # Recommended by Graphite: https://graphite.dev/docs/github-configuration-guidelines#github-actions
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # golangci-lint's `new-from-rev: origin/main` needs full history
          # to compute the diff between HEAD and main.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          # Cache the main module, the tools module (golangci-lint has a heavy
          # dep graph — caching it saves ~30s per run), and the rampart module.
          cache-dependency-path: |
            go.sum
            tools/go.sum
            sensitiveinfo/rampart/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          go -C tools mod tidy
          go -C sensitiveinfo/rampart mod tidy
          files="go.mod go.sum tools/go.mod tools/go.sum sensitiveinfo/rampart/go.mod sensitiveinfo/rampart/go.sum"
          if [[ -n "$(git status --porcelain -- $files)" ]]; then
            echo "::error::go.mod / go.sum are not tidy. Run 'go mod tidy' in the root, tools/, and sensitiveinfo/rampart/ and commit the changes."
            git --no-pager diff -- $files
            exit 1
          fi

      - name: Lint
        # golangci-lint is pinned in tools/go.mod via the `tool` directive;
        # -modfile points `go tool` at that module while keeping cwd at the
        # repo root so `./...` resolves to the main module.
        run: go tool -modfile=tools/go.mod golangci-lint run ./...

      - name: Lint rampart module
        # rampart is a separate module; run the same pinned golangci-lint from
        # inside it (absolute -modfile) so `./...` resolves to that module. It
        # inherits the repo-root .golangci.yml.
        working-directory: sensitiveinfo/rampart
        run: go tool -modfile="${{ github.workspace }}/tools/go.mod" golangci-lint run ./...

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sensitiveinfo/rampart/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Build rampart module
        run: go -C sensitiveinfo/rampart build ./...

      - name: Test rampart module
        # Separate module running the embedded model. -race over that heavy
        # inference is slow, so run the deterministic tests without it.
        run: go -C sensitiveinfo/rampart test -shuffle=on -skip '^TestAdversarialConcurrentDetect$' ./...

      - name: Test rampart concurrency (race)
        # Only the concurrency test needs -race. It drives real Detect calls, so
        # it covers both the pooled forward buffers and the internal matmul
        # parallelism (parallelFor) — the module's only concurrency.
        run: go -C sensitiveinfo/rampart test -race -run '^TestAdversarialConcurrentDetect$' ./...
