name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    # Recommended by Graphite: https://graphite.dev/docs/github-configuration-guidelines#github-actions
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            vuln.go.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Keep the public compatibility floor in go.mod while testing with
          # the latest security-patched release in that Go minor line. Lint
          # stays here rather than on 1.27: the pinned golangci-lint (v2.12.2)
          # panics in staticcheck's IR builder on the Go 1.27 standard library.
          go-version: 1.25.x
          check-latest: true
          # Cache the main module, the tools module (golangci-lint has a heavy
          # dep graph — caching it saves ~30s per run), and the rampart module.
          cache-dependency-path: |
            go.sum
            tools/go.sum
            sensitiveinfo/rampart/go.sum
            examples/nethttp/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          go -C tools mod tidy
          go -C sensitiveinfo/rampart mod tidy
          go -C examples/nethttp mod tidy
          files=(
            go.mod
            go.sum
            tools/go.mod
            tools/go.sum
            sensitiveinfo/rampart/go.mod
            sensitiveinfo/rampart/go.sum
            examples/nethttp/go.mod
            examples/nethttp/go.sum
          )
          if [[ -n "$(git status --porcelain -- "${files[@]}")" ]]; then
            echo "::error::go.mod / go.sum are not tidy. Run 'just tidy' and commit the changes."
            git --no-pager diff -- "${files[@]}"
            exit 1
          fi

      - name: Lint
        # golangci-lint is pinned in tools/go.mod via the `tool` directive;
        # -modfile points `go tool` at that module while keeping cwd at the
        # repo root so `./...` resolves to the main module.
        run: go tool -modfile=tools/go.mod golangci-lint run ./...

      - name: Lint rampart module
        # rampart is a separate module; run the same pinned golangci-lint from
        # inside it (absolute -modfile) so `./...` resolves to that module. It
        # inherits the repo-root .golangci.yml.
        working-directory: sensitiveinfo/rampart
        run: go tool -modfile="${{ github.workspace }}/tools/go.mod" golangci-lint run ./...

      - name: Check vulnerabilities
        run: |
          go tool -modfile=tools/go.mod govulncheck ./...
          go -C sensitiveinfo/rampart tool -modfile="${{ github.workspace }}/tools/go.mod" govulncheck ./...

      - name: Compile the nethttp example
        # The examples are their own modules and nothing else in CI built
        # them, so a rename in the SDK could break one with every other job
        # green. `test` compiles without leaving a binary in the worktree.
        # The agentframework example needs Go 1.26 and is covered by that
        # module's own job instead, because this job pins GOTOOLCHAIN=local
        # at the 1.25 compatibility floor.
        run: go -C examples/nethttp test ./...

  test:
    # The 1.25.x leg keeps the bare "Test (<os>)" name because the main
    # branch ruleset requires those check names.
    name: Test (${{ matrix.os }}${{ matrix.go-label }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
        # The oldest supported Go (the go.mod floor) and the newest release.
        # Go 1.27 runs encoding/json on json/v2 by default, which changed its
        # output for invalid UTF-8, so the SDK builds a different metadata
        # encoder there (metadata_jsonv2.go rather than metadata_json.go).
        # Passing on the floor is not proof of passing on the newest release.
        go: [1.25.x, 1.27.x]
        include:
          - go: 1.27.x
            go-label: ", Go 1.27.x"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest security-patched release in each Go minor line. The
          # cache key includes the Go version, so the legs never share a cache.
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            sensitiveinfo/rampart/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Test with GOEXPERIMENT=jsonv2
        # On Go 1.25 and 1.26 this experiment runs encoding/json on json/v2
        # and builds metadata_jsonv2_experiment.go, which no other leg
        # compiles. Running it on the 1.25.x leg puts that file under a
        # required check.
        if: matrix.go == '1.25.x'
        env:
          GOEXPERIMENT: jsonv2
        run: go test -shuffle=on ./...

      - name: Build rampart module
        run: go -C sensitiveinfo/rampart build ./...

      - name: Test rampart module
        # Separate module running the embedded model. -race over that heavy
        # inference is slow, so run the deterministic tests without it.
        run: go -C sensitiveinfo/rampart test -shuffle=on -skip '^TestAdversarialConcurrentDetect$' ./...

      - name: Test rampart concurrency (race)
        # Only the concurrency test needs -race. It drives real Detect calls, so
        # it covers both the pooled forward buffers and the internal matmul
        # parallelism (parallelFor) — the module's only concurrency.
        run: go -C sensitiveinfo/rampart test -race -run '^TestAdversarialConcurrentDetect$' ./...

  agentframework:
    name: agentframework module
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            vuln.go.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The agentframework module requires Go 1.26 because Microsoft
          # Agent Framework does. The root stays on 1.25 in the other jobs.
          go-version: 1.26.x
          check-latest: true
          cache-dependency-path: |
            agentframework/go.sum
            tools/go.sum
            examples/agentframework/go.sum

      - name: Verify go.mod is tidy
        run: |
          go -C agentframework mod tidy
          go -C examples/agentframework mod tidy
          files=(
            agentframework/go.mod
            agentframework/go.sum
            examples/agentframework/go.mod
            examples/agentframework/go.sum
          )
          if [[ -n "$(git status --porcelain -- "${files[@]}")" ]]; then
            echo "::error::go.mod / go.sum are not tidy. Run 'just tidy' and commit the changes."
            git --no-pager diff -- "${files[@]}"
            exit 1
          fi

      - name: Lint
        working-directory: agentframework
        run: go tool -modfile="${{ github.workspace }}/tools/go.mod" golangci-lint run ./...

      - name: Check vulnerabilities
        run: go -C agentframework tool -modfile="${{ github.workspace }}/tools/go.mod" govulncheck ./...

      - name: Build
        run: go -C agentframework build ./...

      - name: Test
        run: go -C agentframework test -race -shuffle=on ./...

      - name: Compile the agentframework example
        # Its own module, on the same Go 1.26 floor as the module it
        # exercises. `test` compiles without leaving a binary behind.
        run: go -C examples/agentframework test ./...
